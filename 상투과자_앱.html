<title>상투과자 — 시사 학습 일보</title>
<style>
:root{
  --paper:#f5f0e3; --paper2:#efe8d6; --ink:#1c1a16; --ink2:#4a453b;
  --rule:#1c1a16; --accent:#8b2f2f; --tag-pol:#8b2f2f; --tag-soc:#2f5a8b; --tag-it:#3a6b3a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
 font-family:'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo',serif;line-height:1.75;
 background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.015) 0 2px,transparent 2px 4px)}
.wrap{max-width:1020px;margin:0 auto;padding:0 16px}

/* ===== masthead ===== */
.masthead{border-bottom:4px double var(--ink);padding:26px 0 12px;text-align:center}
.mast-top{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink2);
 border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:14px;letter-spacing:.06em}
h1.logo{margin:0;font-size:3.2rem;letter-spacing:.35em;font-weight:900;text-indent:.35em}
.logo small{display:block;font-size:.8rem;letter-spacing:.5em;font-weight:400;color:var(--ink2);margin-top:2px;text-indent:.5em}
.slogan{font-size:.82rem;color:var(--ink2);margin:8px 0 0;border-top:1px solid var(--ink);
 display:inline-block;padding:6px 30px 0;letter-spacing:.12em}

/* ===== nav ===== */
nav{position:sticky;top:0;z-index:40;background:var(--paper);
 border-bottom:2px solid var(--ink);box-shadow:0 2px 0 rgba(28,26,22,.15)}
nav .wrap{display:flex;overflow-x:auto;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;background:none;border:none;border-right:1px solid var(--ink);
 padding:12px 18px;cursor:pointer;font-family:inherit;font-size:.95rem;font-weight:700;color:var(--ink2);
 letter-spacing:.05em;transition:.15s}
nav button:first-child{border-left:1px solid var(--ink)}
nav button:hover{background:var(--paper2);color:var(--ink)}
nav button.active{background:var(--ink);color:var(--paper)}

main{padding:26px 0 90px}
.tab{display:none;animation:fade .3s ease}
.tab.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== headings / newspaper bits ===== */
h2.head{font-size:1.7rem;margin:0 0 4px;font-weight:900;letter-spacing:.02em;
 border-bottom:3px solid var(--ink);padding-bottom:8px;position:relative}
h2.head::after{content:'';display:block;border-bottom:1px solid var(--ink);margin-top:2px}
.dateline{font-size:.78rem;color:var(--ink2);margin:8px 0 20px;letter-spacing:.08em}
h3.section{font-size:1.12rem;margin:34px 0 12px;font-weight:900;display:flex;align-items:center;gap:10px}
h3.section::before{content:'■';font-size:.7rem;color:var(--accent)}

 document.getElementById('t-flash').innerHTML=`
 <h2 class="head">플래시카드</h2>
 <div class="dateline">카드를 누르면 뒤집힙니다 · 총 ${deck.length}장 (기본 ${TERMS.length}장 + 기고 ${deck.length-TERMS.length}장)</div>
 <div class="flash-stage">
  <div class="fcard ${flipped?'flip':''}" onclick="flipCard()">
   <div class="inner">
    <div class="fface"><div class="lbl">용 어</div><div class="txt">${esc(c.f)}</div><div class="byline">[${c.src}] 클릭하여 뜻 보기</div></div>
    <div class="fface back"><div class="lbl">풀 이</div><div class="txt">${esc(c.b)}</div></div>
   </div>
  </div>
  <div class="fmeta">${S.fidx+1} / ${deck.length}</div>
  <div class="bar"><i style="width:${(S.fidx+1)/deck.length*100}%"></i></div>
  <div class="fctrl">
   <button class="btn ghost" onclick="moveCard(-1)">◀ 이전</button>
   <button class="btn" onclick="flipCard()">뒤집기</button>
   <button class="btn ghost" onclick="moveCard(1)">다음 ▶</button>
   <button class="btn ghost sm" onclick="shuffleCard()">🔀 무작위</button>
  </div>
 </div>`;
}
function flipCard(){flipped=!flipped;document.querySelector('.fcard').classList.toggle('flip',flipped);}
function moveCard(d){const n=flashDeck().length;S.fidx=(S.fidx+d+n)%n;flipped=false;save();renderFlash();}
function shuffleCard(){S.fidx=Math.floor(Math.random()*flashDeck().length);flipped=false;save();renderFlash();}

/* ===== 지면 시험 ===== */
let qmode='ox', answers={}, graded=false;
function renderQuiz(){
 const el=document.getElementById('t-quiz');
 const qs=qmode==='ox'?OX:MCQ;
 el.innerHTML=`
 <h2 class="head">지면 시험</h2>
 <div class="dateline">OX ${OX.length}문항 · 객관식 ${MCQ.length}문항 · 틀린 문제는 오답노트에 자동 수록</div>
 <div class="qmode">
  <button class="${qmode==='ox'?'active':''}" onclick="setMode('ox')">○× 문제 (${OX.length})</button>
  <button class="${qmode==='mc'?'active':''}" onclick="setMode('mc')">객관식 문제 (${MCQ.length})</button>
 </div>
 <div id="qlist">${qs.map((q,i)=>qmode==='ox'?`
  <div class="qbox" id="qb${i}">
   <div class="qq">문${i+1}. ${q[0]}</div>
   <div class="oxrow">
    <button class="opt ${answers[i]===true?'sel':''}" onclick="pick(${i},true)">O</button>
    <button class="opt ${answers[i]===false?'sel':''}" onclick="pick(${i},false)">X</button>
   </div>
   <div class="expl" id="ex${i}">해설 — ${q[2]}</div>
  </div>`:`
  <div class="qbox" id="qb${i}">
   <div class="qq">문${i+1}. ${q[0]}</div>
   ${q[1].map((o,j)=>`<button class="opt ${answers[i]===j?'sel':''}" onclick="pick(${i},${j})">${'①②③④'[j]} ${o}</button>`).join('')}
   <div class="expl" id="ex${i}">해설 — ${q[3]}</div>
  </div>`).join('')}</div>
 <div style="text-align:center;margin:20px 0">
  <button class="btn" onclick="grade()">채점하기</button>
  <button class="btn ghost" onclick="resetQuiz()">다시 풀기</button>
 </div>
 <div id="qresult"></div>`;
}
function setMode(m){qmode=m;answers={};graded=false;renderQuiz();}
function pick(i,v){if(graded)return;answers[i]=v;renderQuiz();window.scrollTo(0,document.getElementById('qb'+i).offsetTop-120);}
function grade(){
 const qs=qmode==='ox'?OX:MCQ;
 let right=0;graded=true;
 qs.forEach((q,i)=>{
  const correct=qmode==='ox'?q[1]:q[2];
  const expl=qmode==='ox'?q[2]:q[3];
  const box=document.getElementById('qb'+i);
  const opts=box.querySelectorAll('.opt');
  if(qmode==='ox'){
   opts[correct?0:1].classList.add('right');
   if(answers[i]!==undefined&&answers[i]!==correct)opts[answers[i]?0:1].classList.add('wrongopt');
  }else{
   opts[correct].classList.add('right');
   if(answers[i]!==undefined&&answers[i]!==correct)opts[answers[i]].classList.add('wrongopt');
  }
  document.getElementById('ex'+i).classList.add('show');
  if(answers[i]===correct){right++;}
  else{
   const ua=answers[i]===undefined?'(무응답)':(qmode==='ox'?(answers[i]?'O':'X'):'①②③④'[answers[i]]+' '+qs[i][1][answers[i]]);
   const ca=qmode==='ox'?(correct?'O':'X'):'①②③④'[correct]+' '+qs[i][1][correct];
   const sig=qmode+'|'+q[0];
   if(!S.wrong.some(w=>w.sig===sig))S.wrong.push({sig,mode:qmode,q:q[0],ua,ca,expl,when:new Date().toLocaleDateString('ko-KR')});
  }
 });
 save();
 document.getElementById('qresult').innerHTML=`
  <div class="score-banner">
   <div class="byline">호외 — 채점 결과</div>
   <div class="big">${right} / ${qs.length}</div>
   <div>${right===qs.length?'만점! 신문 1면감입니다 🎉':'틀린 문제는 오답노트 지면에 실렸습니다.'}</div>
  </div>`;
 document.getElementById('qresult').scrollIntoView({behavior:'smooth'});
}
function resetQuiz(){answers={};graded=false;renderQuiz();}

/* ===== 오답노트 ===== */
function renderWrong(){
 const el=document.getElementById('t-wrong');
 el.innerHTML=`
 <h2 class="head">오답노트</h2>
 <div class="dateline">틀린 문제 ${S.wrong.length}건 수록 · 다시 맞히면 지면에서 내리세요</div>
 ${S.wrong.length?S.wrong.map((w,i)=>`
  <div class="article wnote">
   <h4><span class="tag ${w.mode==='ox'?'soc':'pol'}">${w.mode==='ox'?'○×':'객관식'}</span>${esc(w.q)}</h4>
   <div class="byline">${w.when} 오답 기록</div>
   <p>내 답: <span class="ua">${esc(w.ua)}</span> → 정답: <span class="ca">${esc(w.ca)}</span><br>
   <b>해설</b> — ${esc(w.expl)}</p>
   <p style="text-align:right"><button class="btn ghost sm" onclick="delWrong(${i})">✔ 극복했어요 (삭제)</button></p>
  </div>`).join('')+`
  <div style="text-align:center;margin:16px"><button class="btn ghost" onclick="clearWrong()">오답노트 전체 비우기</button></div>`
 :`<div class="empty">아직 오답이 없습니다.<br>지면 시험을 치르면 틀린 문제가 이곳에 자동으로 실립니다.</div>`}`;
}
function delWrong(i){S.wrong.splice(i,1);save();renderWrong();}
function clearWrong(){if(confirm('오답노트를 전부 비울까요?')){S.wrong=[];save();renderWrong();}}

/* ===== 독자 기고 ===== */
function renderAdd(){
 document.getElementById('t-add').innerHTML=`
 <h2 class="head">독자 기고 — 공부한 내용 올리기</h2>
 <div class="dateline">기고한 글은 제1면(정리)에 자동 게재됩니다 · 플래시카드 수록도 선택 가능</div>
 <div class="article">
  <label>분야</label>
  <select id="p-cat"><option value="pol">정치</option><option value="soc">사회·경제</option><option value="it">IT기술</option></select>
  <label>제목 (용어·주제)</label>
  <input type="text" id="p-title" placeholder="예: 필리버스터">
  <label>내용 (정리·풀이)</label>
  <textarea id="p-body" placeholder="예: 소수파가 합법적으로 의사진행을 지연시키는 무제한 토론 제도…"></textarea>
  <label style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
   <input type="checkbox" id="p-flash" checked style="width:auto;margin:0"> 플래시카드·용어 사전에도 수록
  </label>
  <button class="btn" onclick="addPost()">🗞 기고하기</button>
 </div>
 <h3 class="section">내가 올린 글 (${S.posts.length}건)</h3>
 ${S.posts.length?S.posts.slice().reverse().map((p,ri)=>{const i=S.posts.length-1-ri;return`
  <div class="article">
   <h4><span class="tag ${p.cat}">${CAT[p.cat]}</span>${esc(p.title)}</h4>
   <div class="byline">${p.date}${p.flash?' · 플래시카드 수록':''}</div>
   <p>${esc(p.body).replace(/\n/g,'<br>')}</p>
   <p style="text-align:right"><button class="btn ghost sm" onclick="delPost(${i})">삭제</button></p>
  </div>`}).join(''):`<div class="empty">아직 올린 글이 없습니다.</div>`}`;
}
function addPost(){
 const title=document.getElementById('p-title').value.trim();
 const body=document.getElementById('p-body').value.trim();
 if(!title||!body){alert('제목과 내용을 입력해주세요.');return;}
 S.posts.push({cat:document.getElementById('p-cat').value,title,body,
  flash:document.getElementById('p-flash').checked,
  date:new Date().toLocaleDateString('ko-KR')});
 save();renderAdd();
 alert('기고 완료! 제1면(정리)에 게재되었습니다.');
}
function delPost(i){if(confirm('이 글을 삭제할까요?')){S.posts.splice(i,1);save();renderAdd();}}

/* ===== init ===== */
renderSummary();renderFlash();renderQuiz();renderWrong();renderAdd();
</script>
</body>
</html>
